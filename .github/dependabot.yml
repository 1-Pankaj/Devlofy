version: 2
updates:
  # Expo SDK packages must move together — `npx expo install --fix` is the
  # tool that knows the compatible set, so dependency PRs are grouped and
  # reviewed rather than merged blindly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - react-native*
          - react-native-*
          - "@expo/*"
      tooling:
        patterns:
          - typescript
          - eslint*
          - "@types/*"
    commit-message:
      prefix: deps
    labels:
      - dependencies
    ignore:
      # TypeScript 7.0 removed the JS compiler API needed by @typescript-eslint/ts-api-utils,
      # and ESLint 10 removed APIs needed by eslint-plugin-react. Keep on latest 6.x and 9.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
