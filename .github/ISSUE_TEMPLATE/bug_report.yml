name: Bug report
description: Something is broken or shows the wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two answers matter most: your platform, and whether the screen was empty or showed an error. In this app those are different bugs.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the top of the More screen.
      placeholder: 0.8.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android phone
        - Android tablet
        - Web on Chromium
        - Web on Firefox
        - Web on Safari
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and browser version
      placeholder: Android 15 on a Lenovo TB320FC, or macOS 15 with Safari 18.2
    validations:
      required: true

  - type: textarea
    id: step
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Today
        2. Add the task "write the changelog 45m #Devlofy"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A screenshot helps. If text was wrong, quote it.
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Was the screen empty, or did it show an error?
      description: An empty screen means the data loaded and there was nothing to show. A failed load must show an error with a retry button. If data existed but the screen looked empty, that is the bug.
      options:
        - Data existed but the screen looked empty
        - The screen showed an error or retry button
        - The screen looked right, but the action did nothing
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Anything else about your data
      description: Only if it matters. There is no server and no log to fetch. For example "first launch", "after importing a backup", or "project with no hourly rate".
      placeholder: Fresh install, first launch
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: This is not a security issue (those go through SECURITY.md, never a public issue)
          required: true
