name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project keeps a feature budget: a new feature replaces an existing one, or it waits in [`docs/08-backlog.md`](https://github.com/1-Pankaj/Devlofy/blob/master/docs/08-backlog.md). That keeps an offline app small enough for one person to maintain.

        Check [`docs/07-decisions.md`](https://github.com/1-Pankaj/Devlofy/blob/master/docs/07-decisions.md) first. Some good ideas are already declined there, with reasons.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the feature.
      placeholder: I want to see which client owes me money without opening three screens.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you build?
      description: The smallest version that solves the problem.
    validations:
      required: true

  - type: textarea
    id: budget
    attributes:
      label: What does it replace?
      description: Which existing feature gives up its place, or why is this worth breaking the budget? "Nothing" is a fair answer if you explain why.
    validations:
      required: true

  - type: dropdown
    id: surfaces
    attributes:
      label: Where would it live?
      options:
        - Today
        - Garden
        - Work
        - Notes
        - More (as a card)
        - Bench
        - Sentinel
        - GitHub
        - A new screen
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: These are fixed, and they are the reason this project exists.
      options:
        - label: It works with no backend, no account and no cloud AI
          required: true
        - label: It works offline, and any network use is started by the user
          required: true
        - label: User data stays exportable, and stored once rather than copied
          required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I checked the backlog and the decision log for this idea
          required: true
